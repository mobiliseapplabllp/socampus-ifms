<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Travel Detail</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal(null, false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-item>
    <ion-label position="floating">Travel Mode</ion-label>
    <ion-select interface="action-sheet" mode="ios">
      <ion-select-option *ngFor="let dat of travelMode" [value]="dat.id">{{dat.label}}</ion-select-option>
    </ion-select>
  </ion-item>
  <ion-item>
    <ion-label position="floating">Remark</ion-label>
    <ion-textarea rows="3"></ion-textarea>
  </ion-item>

  <ion-row>
    <ion-col size="6" class="ion-text-left">
      <div (click)="openCamera()" class="center camera-button">
        <ion-icon src="assets/img/camera.svg" ></ion-icon>
      </div>
    </ion-col>
    <!-- <ion-col size="6">
      <div (click)="openCamera()" class="center camera-button">
        <ion-icon src="assets/img/camera.svg" ></ion-icon>
      </div>
    </ion-col> -->
  </ion-row>
  <ion-row>
    <ion-col class="ion-text-center">
      <ion-button shape="round">Submit</ion-button>
    </ion-col>
  </ion-row>

</ion-content>
