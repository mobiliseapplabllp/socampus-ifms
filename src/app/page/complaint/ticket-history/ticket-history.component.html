<ion-header mode="md" class="ion-no-border">
  <ion-toolbar class="th-toolbar">
    <ion-title class="th-title">History · #{{ ticket_id }}</ion-title>
    <ion-buttons slot="end">
      <ion-button class="th-close" (click)="closeModal()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="th-empty" *ngIf="!history?.length">
    <ion-icon name="time-outline"></ion-icon>
    <p>No history for this ticket</p>
  </div>

  <!-- Timeline - har entry ek step, rang status ke hisaab se -->
  <div class="th-list" *ngIf="history?.length">
    <div
      class="th-item"
      *ngFor="let dat of history"
      [ngClass]="{
        'wip': dat.ticket_status === 'work in progress',
        'assign': dat.ticket_status === 'assigned',
        'resolve': dat.ticket_status === 'resolve'
      }">

      <span class="th-dot"></span>

      <div class="th-card">
        <div class="th-head">
          <span class="th-stage">{{ dat.stage_desc }}</span>
          <span class="th-date">{{ dat.txn_date | date: 'dd MMM, HH:mm' }}</span>
        </div>

        <p class="th-desc" *ngIf="dat.txn_desc" [innerHTML]="dat.txn_desc"></p>

        <div class="th-meta">
          <span *ngIf="dat.user"><ion-icon name="person-outline"></ion-icon> {{ dat.user }}</span>
          <span *ngIf="dat.source"><ion-icon name="phone-portrait-outline"></ion-icon> {{ dat.source }}</span>
        </div>

        <div class="th-scope" *ngIf="dat.scope_desc">
          <span class="th-scope-label">Scope of work</span>
          <span class="th-scope-value">{{ dat.scope_desc }}</span>
        </div>

        <div class="th-files" *ngIf="dat.ticket_file || dat.oth_file">
          <ion-button
            *ngIf="dat.ticket_file"
            size="small"
            fill="outline"
            color="primary"
            class="th-file-btn"
            (click)="viewDoc(dat.ticket_file, dat.ticket_file_blob_type)">
            <ion-icon slot="start" [name]="dat.txn_desc === '#Video uploaded' ? 'videocam-outline' : 'image-outline'"></ion-icon>
            {{ dat.txn_desc === '#Video uploaded' ? 'Video' : 'Image 1' }}
          </ion-button>
          <ion-button
            *ngIf="dat.oth_file"
            size="small"
            fill="outline"
            color="primary"
            class="th-file-btn"
            (click)="viewDoc(dat.oth_file, dat.ticket_file_blob_type)">
            <ion-icon slot="start" name="image-outline"></ion-icon>
            Image 2
          </ion-button>
        </div>
      </div>
    </div>
  </div>

</ion-content>
