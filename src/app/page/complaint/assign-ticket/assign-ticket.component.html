<ion-header mode="md">
  <ion-toolbar color="primary">
    <ion-title>Assign Ticket</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close(null, false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar (ionChange)="search($event)" debounce="1000"></ion-searchbar>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-virtual-scroll [items]="empList" approxItemHeight="320px">
    <ion-item *virtualItem="let item; let itemBounds = bounds;">
      <ion-label class="ion-text-wrap">
        <h3>{{item.label}}</h3>
        <p>Ticket: <ion-text color="danger"><b>{{item.gpsData?.tkt_in_bucket}}</b></ion-text></p>
        <p [hidden]="item.gpsData?.distance_in_m === 0">Distance: <ion-text color="danger" ><b>{{item.gpsData?.distance}}</b></ion-text></p>
      </ion-label>
      <ion-button slot="end" (click)="assign(item)">Assign</ion-button>
    </ion-item>
  </ion-virtual-scroll>
</ion-content>
