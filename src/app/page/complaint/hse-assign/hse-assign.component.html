<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Assign To</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close(null, false)">Cancel</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-item>
    <ion-input type="text" placeholder="Searcy By..." (ionInput)="search($event)"> </ion-input>
    <ion-button slot="end" class="ion-text-capitalize" (click)="sortArr()"> SORT <ion-icon [name]="isAscending ? 'chevron-up-sharp':'chevron-down-sharp' "></ion-icon> </ion-button>
  </ion-item>
  <ion-item *ngFor="let dat of assignUser" (click)="close(dat, true)" mode="md">
    <ion-radio slot="start" [(ngModel)]="dat.user_id" [value]="dat.isSelect" ></ion-radio>
    <ion-label>
      <h2>{{dat.label}}</h2>
      <p *ngIf="pc_hse_conf?.gps_allow === 1 && val === 'assign'">{{dat.gpsData?.status_label}}</p>
      <p>Ticket: <ion-text color="danger"><b>{{dat.gpsData?.tkt_in_bucket}}</b></ion-text></p>
    </ion-label>
    <ion-text slot="end" *ngIf="pc_hse_conf?.gps_allow === 1 && val === 'assign'">{{dat.gpsData?.distance}}</ion-text>
  </ion-item>
</ion-content>
