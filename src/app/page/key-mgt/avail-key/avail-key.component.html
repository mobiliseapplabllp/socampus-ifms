<ion-header>
  <ion-toolbar>
    <ion-searchbar></ion-searchbar>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-virtual-scroll [items]="availKey" approxItemHeight="320px">
    <ion-item *virtualItem="let item; let itemBounds = bounds;" (click)="closeModal(item, 'true')">
      {{item.key_name}} ({{item.code}})
    </ion-item>
  </ion-virtual-scroll>
</ion-content>
<ion-footer>
  <ion-toolbar class="ion-padding-start ion-padding-end">
    <ion-button expand="block" (click)="closeModal(null, 'false')" class="ion-text-capitalize">Close</ion-button>
  </ion-toolbar>
</ion-footer>
