<ion-tabs>
  <ion-fab vertical="bottom" horizontal="center" translucent="true" id="open-modal" expand="block">
    <ion-fab-button color="primary">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
    <ion-fab-list side="top" class="center-fab-list">
      <ion-button size="small" expand="block" shape="round" (click)="openRoute('/key-mgt/assign-key')">
        <ion-icon slot="start" name="person-add-outline"></ion-icon>Assign Key
      </ion-button>
      <ion-button size="small" expand="block" shape="round" (click)="openRoute('/key-mgt/add-key')">
        <ion-icon slot="start" name="key-outline"></ion-icon>Add Key
      </ion-button>
    </ion-fab-list>
  </ion-fab>

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <div class="tab-spacer"></div>

    <ion-tab-button tab="keys">
      <ion-icon name="key-outline"></ion-icon>
      <ion-label>Keys</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
