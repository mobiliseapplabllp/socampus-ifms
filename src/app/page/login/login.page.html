
<ion-content class="center">
  <ion-row style="position:absolute;top:100px;width:100%">
    <ion-col class="ion-text-center">
      <img src="assets/img/white-logo.png" style="height:35px;width:210px">
    </ion-col>
  </ion-row>
  <div style="width:100%;height:100%;border-top:50vh solid var(--ion-color-primary);position: absolute;top:0px;z-index:-1"></div>
  <div style="height:100%;width:100%" class="center">
    <ion-card style="min-height:40vh;width:90vw;box-shadow: rgba(9, 30, 66, 0.25) 0px 4px 8px -2px, rgba(9, 30, 66, 0.08) 0px 0px 0px 1px;padding:20px;border-radius: 30px;" class="center">
      <section style="width:100%;min-height:40vh;" *ngIf="viewCondition === 'sso' ">
        <ion-row>
          <ion-col>
            <h2>
              <ion-text color="dark">Login</ion-text>
            </h2>
          </ion-col>
        </ion-row>
        <br>
        <ion-row>
          <ion-col>
            <ion-button expand="block" fill="outline" class="ion-text-capitalize custom" (click)="openInAppBrowser()">i am a SSO User <ion-icon name="arrow-forward-outline" slot="end"></ion-icon></ion-button>
            <ion-note style="padding-left:10px;" color="medium">use this if you have a @sodexo Email ID.</ion-note>
          </ion-col>
        </ion-row>
        <br>
        <br>
        <ion-row>
          <ion-col>
            <ion-button expand="block" fill="outline" class="ion-text-capitalize custom" (click)="viewCondition = 'login' ">No, i am not a SSO User <ion-icon name="arrow-forward-outline" slot="end"></ion-icon></ion-button>
            <ion-note style="padding-left:10px;" color="medium">use this if you want to log in with your Emp ID.</ion-note>
          </ion-col>
        </ion-row>
      </section>
      <section style="width:100%;min-height:40vh;border-radius: 16px;" *ngIf="viewCondition === 'login'">
        <ion-row>
          <ion-col class="ion-no-padding">
            <ion-button fill="clear" (click)="viewCondition = 'sso' " size="small">
              <ion-icon name="chevron-back-outline" slot="start" > </ion-icon> Back
            </ion-button>
          </ion-col>
        </ion-row>
        <h2>
          <ion-text color="dark">Login</ion-text>
        </h2>
        <form [formGroup]="loginForms" (ngSubmit)="onLogin()" mode="md"><!--(ngSubmit)="onLogin()"-->
          <section class="inputbox">
            <ion-text color="primary" >User ID</ion-text>
            <ion-item lines="none">
              <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
              <ion-input type="text" placeholder="USER ID" [(ngModel)]="login.userid"  formControlName="userid"></ion-input>
            </ion-item>
          </section>

          <section class="inputbox" >
            <ion-text color="primary">Password </ion-text>
            <ion-item lines="none">
              <ion-icon name="key-outline" slot="start" color="primary"></ion-icon>
              <ion-input [type]="isPassword ? 'password': 'text'" placeholder="Password" [(ngModel)]="login.password" formControlName="password"></ion-input>
              <ion-buttons slot="end">
                <ion-button fill="clear" (click)="isPassword = !isPassword">
                  <ion-icon [name]="isPassword ? 'eye-outline':'eye-off-outline' " slot="icon-only"></ion-icon>
                </ion-button>
              </ion-buttons>
            </ion-item>
          </section>

          <ion-row class="ion-margin-top">
            <ion-col class="ion-no-padding">
              <ion-button type="submit" expand="block" color="primary"  [disabled]="!loginForms.valid || !isHidden" class="ion-text-capitalize"> Next  <ion-spinner *ngIf="!isHidden"></ion-spinner>  </ion-button>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col class="ion-text-center">
              <ion-text color="primary" (click)="openPage('/forgot-password')"><b>Forgot Password</b></ion-text>
            </ion-col>
          </ion-row>
        </form>
      </section>
      <section style="width:100%;min-height:40vh" *ngIf="viewCondition === 'multi_factor'">
        <ion-row >
          <ion-col class="ion-no-padding" >
            <ion-button fill="clear" (click)="viewCondition = 'login'" size="small">
              <ion-icon name="chevron-back-outline" slot="start" > </ion-icon> Back
            </ion-button>
          </ion-col>
        </ion-row>
        <h2>
          <ion-text color="dark">Multi-Factor Authentication</ion-text>
        </h2>
        <p>
          <ion-text color="primary">{{sendMobileMsg}}</ion-text>
        </p>
        <br>

        <ion-row>
          <ion-col class="ion-text-center">
            <ng-otp-input (onInputChange)="getOtpValue($event)" [config]="otpConfig"></ng-otp-input>
          </ion-col>
        </ion-row>
        <br>
        <br>
        <ion-row>
          <ion-col class="ion-no-padding">
            <ion-button expand="block" fill="solid" class="ion-text-capitalie" [disabled]="!otp" (click)="verifyOtp()">Submit Code </ion-button>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <ion-button expand="block" fill="clear" class="ion-text-capitalie" [disabled]="!isHidden" (click)="onLogin()">Resend Code  <ion-spinner *ngIf="!isHidden"></ion-spinner>  </ion-button>
          </ion-col>
        </ion-row>
      </section>
    </ion-card>
  </div>

  <ion-grid style="position:absolute;bottom:10px;width:100%">
    <ion-row>
      <ion-col  class="ion-text-center">
        <ion-text color="primary" style="font-size:11px;font-weight: 530;">Powered By</ion-text>
      </ion-col>
    </ion-row>
    <ion-row >
      <ion-col class="ion-text-center">
        <img src="assets/img/mobilise-logo.svg" style="height:23px;width:88px">
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
