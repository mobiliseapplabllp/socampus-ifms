<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>
     <ion-label>Spare Parts</ion-label>
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" >
    <ion-fab-button fill="clear" color="primary" (click)="crIndent()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-card *ngFor="let dat of req_indent;let i = index" [ngClass]="{'cls1': i % 2 === 0, 'cls2': i % 2 !== 0}">
    <ion-row>
      <ion-col size="6" >
        <div style="font-family: 'sansapro_normal' !important;">{{dat.wrnty_exp_date}}</div>
      </ion-col>
      <ion-col size="6" class="ion-text-right">
        <span [ngClass]="{'cls11': i % 2 === 0, 'cls21': i % 2 !== 0}">Quantity - {{dat.qty}}</span> 
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="6" class="vc">
        <div style="font-family: 'opensans_bold' !important;color:black">SKU : {{dat.sku}}</div>
      </ion-col>
      <ion-col size="6" class="ion-text-right">
        <ion-button size="small" fill="clear">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>{{dat.uom_desc}}</ion-col>
    </ion-row>          
  </ion-card>
</ion-content>
