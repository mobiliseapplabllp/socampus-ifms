<ion-content>
  <ion-toolbar color="none" mode="ios">
    <ion-buttons slot="start">
      <ion-button></ion-button>
    </ion-buttons>
    <ion-title class="ion-text-center" color="light">Emergency</ion-title>
    <ion-buttons slot="end">
      <ion-button color="light" (click)="closeModal(null, false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <div style="width:100%;height:20%;"></div>
  <div style="width:100%;height:40%;" class="center">
    <div class="sos-icon center">
      <ion-text color="danger">SOS</ion-text>
    </div>
  </div>
  <div style="width:100%;height:30%;" class="center ion-padding-start ion-padding-end ion-text-center">
    <ion-text color="light">Plesae Standby, we are currently requesting for help with <b>{{timeout}}</b> second</ion-text>
  </div>
</ion-content>
