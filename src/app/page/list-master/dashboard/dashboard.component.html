<div class="dashboard">
  <ion-slides #mySlider [options]="option">
    <ion-slide *ngFor="let card of cards; trackBy: trackByTitle">
      <ion-card class="dash-card">
        <div class="dash-head">
          <span class="dash-icon">
            <img [src]="card.icon" [alt]="card.title">
          </span>
          <div class="dash-head-text">
            <span class="dash-title">{{ card.title }}</span>
            <span class="dash-sub">{{ card.subtitle }}</span>
          </div>
        </div>
        <!-- Number upar bada, label neeche chhota - poori chaudai me teen barabar hisse -->
        <div class="dash-stats">
          <div class="dash-stat" *ngFor="let s of card.stats; let i = index">
            <span class="dash-value" [class.dash-value--warn]="i === 1" [class.dash-value--alert]="i === 2">
              {{ s.value || 0 }}
            </span>
            <span class="dash-label">{{ s.label }}</span>
          </div>
        </div>
      </ion-card>
    </ion-slide>
  </ion-slides>
  <!-- Bullet - chalu wala thoda bada aur primary rang me -->
  <div class="dash-pager"></div>
</div>
