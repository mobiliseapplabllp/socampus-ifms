<div class="hm-section-head">
  <h3 class="hm-section-title">Our Services</h3>
  <span class="hm-count-chip" *ngIf="menuItems.length">{{ menuItems.length }} modules</span>
</div>
<!-- Pehle yahan ion-slides tha - Swiper har touch par JS chalata hai, isliye
     khisakne me dheema lagta tha. Ye seedha CSS scroll hai, browser khud
     sambhalta hai, isliye ungli ke saath chalta hai -->
<div class="ms-scroller">
  <button class="ms-tile" *ngFor="let val of menuItems" (click)="openPage(val)">
    <span class="ms-icon">
      <img class="ms-glyph" [src]="val.icon_path" [alt]="val.smnu_desc">
    </span>
    <span class="ms-label">{{ val.smnu_desc }}</span>
  </button>
</div>
