<ion-row>
  <ion-col class="ion-padding-start">
    <ion-text color="primary"><b>Our Services</b></ion-text>
  </ion-col>
</ion-row>
<div class="custom-menu-slider">
  <div class="custom-menu-slide" *ngFor="let dat of menuNew">
    <ion-grid class="menu-slide-grid">
      <ion-row class="menu-slide-row">
        <ion-col *ngFor="let val of dat.menu" size="12" class="menu-slide-col">
          <ion-card class="menu-service-card" (click)="openPage(val)">
            <div class="menu-service-card__icon center">
              <ion-img [src]="val.icon_path"></ion-img>
            </div>
            <div class="menu-service-card__label center">
              <ion-text color="primary">{{ val.smnu_desc }}</ion-text>
            </div>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</div>
