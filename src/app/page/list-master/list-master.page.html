<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title> {{userName}} </ion-title>
    <ion-buttons slot="end">
      <ion-button slot="icon-only">
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
      <ion-button slot="icon-only">
        <ion-icon name="person-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

</ion-header>
<ion-content>
    <ion-item>
      <ion-label>
        <h2><b><ion-text color="primary">Welcome Home</ion-text></b></h2>
        <p><ion-text>{{userName}}</ion-text></p>
      </ion-label>
    </ion-item>

    <ion-row>
      <ion-col class="ion-padding-start">
        <ion-text color="primary"><b>Our Services</b></ion-text>
      </ion-col>
    </ion-row>

    </ion-row>

        <ion-slide >
          <ion-card  class="ion-text-left ion-padding">
            <div>
              <ion-icon name="flame-outline" color="light" style="font-size: 40px" ></ion-icon><br>
              <ion-text color="light" style="margin-left:5px;font-weight: 550;">Breakdown </ion-text>
            </div>
            <br>
            <div>
              <ion-text color="light" style="margin-left:5px;font-weight: 550;font-size:18px">{{breakdown}}</ion-text>
            </div>
          </ion-card>
        </ion-slide>
        <ion-slide>
          <ion-card  class="ion-text-left ion-padding">
            <div>
              <ion-icon name="flame-outline" color="light" style="font-size: 40px" ></ion-icon><br>
              <ion-text color="light" style="margin-left:5px;font-weight: 550;">PMS </ion-text>
            </div>
            <br>
            <div>
              <ion-text color="light" style="margin-left:5px;font-weight: 550;font-size:18px">{{pr}}</ion-text>
            </div>
          </ion-card>
        </ion-slide>
        <ion-slide>

            <div>

              <ion-text color="light" style="margin-left:5px;font-weight: 550;">Spare Part </ion-text>
            </div>

            <div>
              <ion-text color="light" style="margin-left:5px;font-weight: 550;font-size:18px">{{indent}}</ion-text><!--{{indent.inapproval}}-->
            </div>
          </ion-card>
        </ion-slide>
      </ion-slides>
    </div>
    <ion-row>
      <ion-col size="4" class="ion-text-right">
        <ion-button fill="clear" >
          <ion-icon name="chevron-back-outline"></ion-icon>
        </ion-button>
      </ion-col>
      <ion-col size="4" class="ion-text-center center">
        <b>12 Oct 2023</b>
      </ion-col>
      <ion-col size="2" class="ion-text-left" >
        <ion-button fill="clear" >
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </ion-button>
      </ion-col>
      <ion-col size="2" class="ion-text-left">
        <ion-button id="home-circle-date" fill="clear" color="primary" class="ion-text-capitalize">
          <ion-icon name="calendar-outline"></ion-icon>
        </ion-button>
        <ion-popover trigger="home-circle-date" mode="md">
          <ng-template>
            <ion-datetime #popoverDatetime max="2099" presentation="date" size="cover"  (ionChange)="changeDateComponent($event)"></ion-datetime>
          </ng-template>
        </ion-popover>
      </ion-col>
    </ion-row>

    <div style="width:100%;">
      <canvas id="canvas1" style="width:100%;"></canvas>
    </div>
