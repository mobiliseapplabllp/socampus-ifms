<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>SoCampus</ion-title>
    <ion-buttons slot="end" *ngIf="isInternet">
      <!-- CKMS - cambro ka QR scan -->
      <ion-button slot="icon-only" (click)="openBarcode()">
        <ion-icon name="qr-code-outline"></ion-icon>
      </ion-button>
      <!-- <ion-button (click)="testRoute('/concierge/conc-menu')">C</ion-button> -->
      <!-- <ion-button (click)="testRoute('/concierge')">Concierge</ion-button> -->
       <!-- <ion-button (click)="notification('/notification')">
        <ion-icon name="notifications-outline"></ion-icon>
        <ion-text color="danger" style="position: absolute;top:0px;right:0px">{{alerts.length}}</ion-text>
      </ion-button> -->
      <ion-button slot="icon-only" class="hm-icon-btn" (click)="notification('/notification')">
        <ion-icon name="notifications-outline"></ion-icon>
        <span class="hm-badge" *ngIf="notiticationCount > 0">{{ notiticationCount > 99 ? '99+' : notiticationCount }}</span>
      </ion-button>
      <ion-button slot="icon-only" class="hm-icon-btn" (click)="openPageRoute()">
        <ion-icon name="cloud-upload-outline"></ion-icon>
        <span class="hm-badge" *ngIf="DGArr.length > 0">{{ DGArr.length > 99 ? '99+' : DGArr.length }}</span>
      </ion-button>
      <ion-button slot="icon-only" [disabled]="isLoading" (click)="changeEvent()" class="ion-text-capitalize">
        <ion-icon  slot="end" name="reload-outline" *ngIf="!isLoading"></ion-icon>
        <ion-spinner slot="end"  name="lines-sharp" *ngIf="isLoading"></ion-spinner>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>  
  <!-- Welcome card - naam bayein, availability dayein. Chip par tap = side menu,
       jahan Punch In/Out ka button hai -->
  <div class="hm-welcome-card">
    <!-- Avatar par hara/grey dot - ek nazar me pata chal jaata hai ki available ho ya nahi -->
    <div class="hm-avatar">
      <span>{{ initials }}</span>
      <i class="hm-avatar-dot" [class.hm-avatar-dot--in]="isPunchIn"></i>
    </div>
    <div class="hm-welcome-text">
      <p class="hm-welcome-hi">Welcome home</p>
      <h2 class="hm-welcome-name">{{ userName }}</h2>
      <ion-button
        size="small"
        class="ion-text-capitalize hm-update-btn"
        color="danger"
        (click)="openPlayStore(appUpdate.url)"
        *ngIf="isAndroid && appUpdate.is_view && currentVersion !== appUpdate.vesrion">App Update</ion-button>
    </div>

    <button class="hm-punch-chip" [class.hm-punch-chip--in]="isPunchIn" (click)="openMenu()">
      <ion-icon name="ellipse"></ion-icon>
      {{ isPunchIn ? 'Available' : 'Not available' }}
    </button>
  </div>
  <!-- Trip chalu ho to home par turant dikhe ki kis ticket ki chal rahi hai.
       Tap = server se haal milao (End Trip ka response kho gaya ho to yahin se nikalte hain) -->
  <button type="button" class="hm-trip-card" *ngIf="activeTrip"
          [disabled]="tripCardBusy" (click)="onTripCardTap()">
    <span class="hm-trip-dot"></span>
    <div class="hm-trip-text">
      <p class="hm-trip-title">Trip is active</p>
      <p class="hm-trip-sub">Ticket #{{ activeTrip.id }} · started {{ tripSince }}</p>
      <p class="hm-trip-hint">{{ tripCardBusy ? 'Checking…' : 'Tap to check status' }}</p>
    </div>
    <ion-icon name="chevron-forward-outline"></ion-icon>
  </button>

  <app-dashboard [eventChange]="eventChange" ></app-dashboard>
  <ion-button [disabled]="isFmsLoading" (click)="spaceMgt()">Space Mgt</ion-button>
  <ion-button (click)="testRoute('/parking-mgt')">Parking Mgt</ion-button>
  <ion-button (click)="testRoute('/visitor-mgt')">visitor Mgt</ion-button>
  <ion-button (click)="testRoute('/key-mgt')">Key Mgt</ion-button>
  <ion-button (click)="testRoute('/mailroom-mgt')">Mailroom Mgt</ion-button>  
  <app-menu [didEnter]="didEnter"></app-menu>
  <app-pending-task [eventChange]="eventChange" [didEnter]="didEnter"  *ngIf="isInternet"></app-pending-task>
</ion-content>
