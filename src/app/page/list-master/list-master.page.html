<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title> <ion-icon name="ellipse"  [color]="isPunchIn ? 'success' : 'medium'" style="padding-top: 2%;"></ion-icon> {{userName}} </ion-title>
    <ion-buttons slot="end" *ngIf="isInternet">
      <!-- <ion-button (click)="testRoute('/concierge/conc-menu')">C</ion-button> -->
      <!-- <ion-button (click)="testRoute('/concierge')">Concierge</ion-button> -->
       <!-- <ion-button (click)="notification('/notification')">
        <ion-icon name="notifications-outline"></ion-icon>
        <ion-text color="danger" style="position: absolute;top:0px;right:0px">{{alerts.length}}</ion-text>
      </ion-button> -->
      <ion-button slot="icon-only" (click)="notification('/notification')" style="position: relative;">        
        <ion-icon name="notifications-outline"></ion-icon>
        <ion-text color="danger" style="position: absolute;top:0px;right:0px">{{notiticationCount}}</ion-text>
      </ion-button>
      <ion-button slot="icon-only"  (click)="openPageRoute()" style="position: relative;">
        <ion-icon name="cloud-upload-outline"></ion-icon>
        <ion-text color="danger" style="position: absolute;top:0px;right:0px">{{DGArr.length}}</ion-text>
      </ion-button>
      <ion-button slot="icon-only" [disabled]="isLoading" (click)="changeEvent()" class="ion-text-capitalize">
        <ion-icon  slot="end" name="reload-outline" *ngIf="!isLoading"></ion-icon>
        <ion-spinner slot="end"  name="lines-sharp" *ngIf="isLoading"></ion-spinner>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>  
  <ion-item>
    <ion-label>
      <h2><b><ion-text color="primary">Welcome Home</ion-text></b></h2>
      <p style="font-size:18px"><ion-text>{{userName}}</ion-text></p>
    </ion-label>
    <!-- <ion-buttons slot="end">
      <ion-button slot="end" color="danger" shape="round" fill="outline" (click)="openSosModal()">SOS</ion-button>
    </ion-buttons> -->
    <ion-button size="small" slot="end" class="ion-text-capitalize" color="danger" (click)="openPlayStore(appUpdate.url)" *ngIf="isAndroid && appUpdate.is_view && currentVersion !== appUpdate.vesrion" >App Update</ion-button>
  </ion-item>
  <app-tracking-card [didEnter]="didEnter"></app-tracking-card>
  <app-dashboard [eventChange]="eventChange" ></app-dashboard>
  <app-menu [didEnter]="didEnter"></app-menu>
  <app-pending-task [eventChange]="eventChange" [didEnter]="didEnter"  *ngIf="isInternet"></app-pending-task>
</ion-content>
