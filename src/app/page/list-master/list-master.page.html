<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title> {{userName}} </ion-title>
    <ion-buttons slot="end">
      <ion-button slot="icon-only">
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
      <ion-button slot="icon-only">
        <ion-icon name="person-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div *ngIf="isInternet">
    <ion-item>
      <ion-label>
        <h2><b><ion-text color="primary">Welcome Home</ion-text></b></h2>
        <p style="font-size:18px"><ion-text>{{userName}}</ion-text></p>
      </ion-label>
    </ion-item>
    <app-dashboard></app-dashboard>
    <app-menu></app-menu>
    <app-pending-task></app-pending-task>
  </div>
  <div *ngIf="!isInternet">
    <ion-row>
      <ion-col size="4" *ngFor="let val of myMenu">
        <ion-card style="margin:0px; min-height: 80px;width:100%; box-shadow:1px 1px 8px #26589c;border-radius: 10px;" (click)="openPage(val)">
          <div style="height:60px;width:100%" class="center">
            <ion-img [src]="val.icon_path" style="height:35px;width:35px" *ngIf="isInternet"></ion-img>
            <ion-img src="assets/imgs/C2.svg" style="height:35px;width:35px" *ngIf="!isInternet"></ion-img>
          </div>
          <div style="min-height:20px;width:100%" class="center">
            <ion-text color="primary" style="font-weight: 500;"> {{val.smnu_desc}} </ion-text>
          </div>
        </ion-card>
      </ion-col>
    </ion-row>
  </div>

</ion-content>
