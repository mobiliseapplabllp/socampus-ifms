<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title> {{userName}} </ion-title>
    <!-- <ion-buttons slot="end">
      <ion-button slot="icon-only">
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
      <ion-button slot="icon-only">
        <ion-icon name="person-outline"></ion-icon>
      </ion-button>
    </ion-buttons> -->
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-item>
    <ion-label>
      <h2><b><ion-text color="primary">Welcome Home</ion-text></b></h2>
      <p style="font-size:18px"><ion-text>{{userName}}</ion-text></p>
    </ion-label>
    <ion-buttons slot="end">
      <ion-button [disabled]="isLoading" (click)="changeEvent()" class="ion-text-capitalize" color="primary" fill="outline" shape="round">
        Reload
        <ion-icon name="reload-outline" slot="end" *ngIf="!isLoading"></ion-icon>
        <ion-spinner slot="end"  name="lines-sharp" *ngIf="isLoading"></ion-spinner>
      </ion-button>
    </ion-buttons>
  </ion-item>
  <app-dashboard [eventChange]="eventChange" ></app-dashboard>
  <app-menu></app-menu>
  <app-pending-task [eventChange]="eventChange"></app-pending-task>
</ion-content>
