<ion-item lines="none">
  <ion-buttons slot="start">
    <ion-button></ion-button>
  </ion-buttons>
  <ion-label class="ion-text-center"><b>My Pending Task</b></ion-label>
  <ion-button slot="end" (click)="changePendingTask()" fill="clear">
    <ion-text *ngIf="pendingTask"><ion-icon src="assets/home_banner1/pie-chart.svg" style="height:20px;width:20px;"></ion-icon></ion-text>
    <ion-text *ngIf="!pendingTask"><ion-icon src="assets/home_banner1/engineer.svg" style="height:20px;width:20px;"></ion-icon></ion-text>
  </ion-button>
</ion-item>

<div *ngIf="pendingTask">
  <ion-row style="background-color: rgb(227, 225, 225);">
    <ion-col size="3">
      <ion-button expand="block" [color]="segments === 'helpdesk'? 'primary':'medium'" (click)="clickCustomSegment('helpdesk')">Helpdesk</ion-button>
    </ion-col>
    <ion-col size="3">
      <ion-button expand="block" [color]="segments === 'digital'? 'primary':'medium'" (click)="clickCustomSegment('digital')">Digital</ion-button>
    </ion-col>
    <ion-col size="3">
      <ion-button expand="block" [color]="segments === 'pms'? 'primary':'medium'" (click)="clickCustomSegment('pms')">PMS</ion-button>
    </ion-col>
    <ion-col size="3">
      <ion-button expand="block" [color]="segments === 'meter'? 'primary':'medium'" (click)="clickCustomSegment('meter')">Meter</ion-button>
    </ion-col>
  </ion-row>
  <div [ngSwitch]='segments'>
    <div *ngSwitchCase= "'helpdesk'">
      <div *ngFor="let dat of pendingTicket">
        <app-complaint-cards [data]="dat" [ticketType]="dat.status"  (greetEvent)="myCustom($event)"></app-complaint-cards>
      </div>
    </div>
