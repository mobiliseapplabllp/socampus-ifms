<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Assign User</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close(null, false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-radio-group [(ngModel)]="isSelect">
    <ion-item *ngFor="let dat of assignUsers">
      <ion-label>
        <h3>{{dat.fname}}</h3>
        <p>Work Load {{dat.workload}}</p>
      </ion-label>
      <ion-radio slot="start" [value]="dat.id"></ion-radio>
    </ion-item>
  </ion-radio-group>
  <ion-row>
    <ion-col size="12" class="ion-text-center">
      <ion-button color="primary" (click)="assign()">Assign</ion-button>
    </ion-col>
  </ion-row>

</ion-content>
