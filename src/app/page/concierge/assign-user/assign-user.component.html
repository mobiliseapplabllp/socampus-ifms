<ion-header class="ion-no-border">
  <ion-toolbar >
    <ion-title>Assign</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close(null, false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-item *ngFor="let dat of assignUsers;let i = index" lines="none">
    <ion-avatar slot="start" class="center">{{i+1}}</ion-avatar>
    <ion-label>{{dat.fname}}</ion-label>
    <ion-button slot="end" size="small" fill="outline" (click)="assign(dat)">Assign</ion-button>
  </ion-item>
