  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Concierge</ion-title>
  </ion-toolbar>
</ion-header>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed" >
    <ion-fab-button fill="clear" color="primary" (click)="createTicket()">

    </ion-fab-button>
  </ion-fab>
  <ion-segment  [(ngModel)]='status' (ionChange)="changeSegment($event)">
    <ion-segment-button value="assignto">
      <ion-label>Assigned Case </ion-label>
    </ion-segment-button>
    <ion-segment-button value="created">
      <ion-label>My Case </ion-label>
    </ion-segment-button>
  </ion-segment>

  <ion-grid>
    <ion-row>
      <ion-col *ngFor="let dat of ticketData" size="12">
        <ion-card style="box-shadow: rgba(0, 0, 0, 0.05) 0px 6px 24px 0px, rgba(0, 0, 0, 0.08) 0px 0px 0px 1px; margin: 0px 10px;border-left:6px solid var(--ion-color-primary)">
          <ion-item lines="none">
            <ion-label>Request ID {{dat.ext_id}}</ion-label>
            <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
          </ion-item>
          <div style="padding-left: 10px;font-size:12px" class="card">
            <ion-row>
              <ion-col size="6">Request Date & Time</ion-col>
              <ion-col size="6">{{dat.created_at}}</ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">Assigned to</ion-col>
              <ion-col size="6">{{dat.lg_name}} {{dat.lg_lname}}</ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">Urgency</ion-col>
              <ion-col size="6" style="padding-bottom: 12px">
                <span style="margin: 2px 5px;" [ngClass]="{'high': dat.priority === 'High', 'medium': dat.priority === 'Medium', 'low': dat.priority === 'Low'}">
                  {{dat.priority}}
                </span>

              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">Status</ion-col>
              <ion-col size="6" style="padding-top: 2px;">
                <span style="margin: 2px 5px;" [ngClass]="{'assigned': dat.stage_desc === 'Assigned', 'in_progress': dat.stage_desc === 'In progress'}">
                  {{dat.stage_desc}}
                </span>
              </ion-col>
            </ion-row>
          </div>
          <ion-row style="border-top: 1px solid rgb(199, 197, 197);margin-top:10px">
            <ion-col size="4" >
              <ion-button size="small" shape="round" fill="outline" (click)="openHistory(dat)">History</ion-button>
            </ion-col>
            <ion-col size="4" class="ion-text-center">
              <ion-button size="small" shape="round" fill="outline" (click)="assignUser(dat)">Assign</ion-button>
            </ion-col>
            <ion-col size="4" class="ion-text-center">
              <ion-button size="small" shape="round" fill="outline" (click)="workNow(dat)">Work Now</ion-button>
            </ion-col>
          </ion-row>

          <!-- <ion-row>
            <ion-col size="6">
