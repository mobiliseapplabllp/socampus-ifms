<ion-content mode="md">
  <!-- <ion-fab vertical="bottom" horizontal="end" slot="fixed" >
    <ion-fab-button fill="clear" color="primary" (click)="createTicket()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab> -->

  <div class="ticket-list">
    <div *ngFor="let dat of ticketData" class="ticket-card" [style.border-left-color]="getStatusBorderColor(dat.stage_desc)">

      <div class="ticket-header" (click)="workNow(dat, 'details')">
        <div class="ticket-id">{{dat.ext_id}}</div>
        <span class="status-badge" [ngClass]="getStatusClass(dat.stage_desc)">{{dat.stage_desc}}</span>
      </div>

      <div class="ticket-body">
        <div class="ticket-row">
          <ion-icon name="flag-outline" class="row-icon"></ion-icon>
          <span class="row-label">Urgency</span>
          <span class="priority-badge" [ngClass]="{'high': dat.priority === 'High', 'medium': dat.priority === 'Medium', 'low': dat.priority === 'Low'}">{{dat.priority}}</span>
        </div>

        <div class="ticket-row">
          <ion-icon name="folder-outline" class="row-icon"></ion-icon>
          <span class="row-label">Category</span>
          <span class="row-value">{{dat.cat_desc}}</span>
        </div>
        <div class="ticket-row">
          <ion-icon name="pricetag-outline" class="row-icon"></ion-icon>
          <span class="row-label">Sub Category</span>
          <span class="row-value">{{dat.subcat_desc}}</span>
        </div>
        <div class="ticket-row">
          <ion-icon name="calendar-outline" class="row-icon"></ion-icon>
          <span class="row-label">Request Date</span>
          <span class="row-value">{{dat.created_at}}</span>
        </div>
        <div class="ticket-row">
          <ion-icon name="person-outline" class="row-icon"></ion-icon>
          <span class="row-label">Assigned To</span>
          <span class="row-value">{{dat.username}} {{dat.name}} {{dat.lname}}</span>
        </div>
       
      </div>

      <div class="ticket-actions">
        <ion-button size="small" fill="clear" color="medium" (click)="openHistory(dat)">
          <ion-icon name="time-outline" slot="start"></ion-icon> History
        </ion-button>
        <ion-button size="small" fill="clear" color="tertiary" (click)="openTripLogs(dat)">
          <ion-icon name="navigate-outline" slot="start"></ion-icon> Trip Log
        </ion-button>
        <ion-button *ngIf="(status === 'assignto' || status === 'created') && dat.show_asn_btn" size="small" fill="clear" color="primary" [disabled]="dat.tckt_trip === '2'" (click)="assignUser(dat)">
          <ion-icon name="people-outline" slot="start"></ion-icon> Assign
        </ion-button>
        <ion-button *ngIf="(status === 'assignto' || status === 'created') && userData.id === dat.assign_to" size="small" fill="clear" color="success" (click)="workNow(dat, 'action')">
          <ion-icon name="hammer-outline" slot="start"></ion-icon> Work Now
        </ion-button>
        <ion-button *ngIf="status === 'completed' && dat.tckt_status === 4" size="small" fill="clear" color="danger" (click)="presentAlertConfirm(dat)">
          <ion-icon name="refresh-outline" slot="start"></ion-icon> RE-Open
        </ion-button>
      </div>
    </div>

    <ion-infinite-scroll threshold="100px" (ionInfinite)="loadData($event)" *ngIf="canLoadMore">
      <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Loading more data..."> </ion-infinite-scroll-content>
    </ion-infinite-scroll>

  </div>
</ion-content>
