<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Concierge</ion-title>
    <!-- <ion-buttons slot="end">
      <ion-button (click)="startTracking()">S</ion-button>
      <ion-button (click)="stopTracking()">E</ion-button>
      <ion-button (click)="getLocations()">G</ion-button>
      <ion-button (click)="clearLocations()">C</ion-button>
    </ion-buttons> -->
  </ion-toolbar>
  <ion-toolbar class="medium ion-no-padding">
    <ion-segment  [(ngModel)]='status' (ionChange)="changeSegment($event)">
      <ion-segment-button value="assignto">
        <ion-label>Assigned Case </ion-label>
      </ion-segment-button>
      <ion-segment-button value="created">
        <ion-label>My Case </ion-label>
      </ion-segment-button>
      <ion-segment-button value="completed">
        <ion-label>Completed </ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>
<ion-content mode="md">
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" >
    <ion-fab-button fill="clear" color="primary" (click)="createTicket()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-grid>
    <ion-row>
      <ion-col *ngFor="let dat of ticketData" size="12">
        <ion-card style="box-shadow: rgba(0, 0, 0, 0.05) 0px 6px 24px 0px, rgba(0, 0, 0, 0.08) 0px 0px 0px 1px; margin: 0px 10px;border-left:6px solid var(--ion-color-primary)">
          <ion-item lines="none">
            <ion-label>{{dat.ext_id}}</ion-label>
            <ion-button slot="end" fill="clear" (click)="workNow(dat ,'details')">
              <ion-icon name="chevron-forward-outline"></ion-icon>
            </ion-button>
            
          </ion-item>
          <div style="padding-left: 10px;font-size:12px">
            <ion-row>
              <ion-col size="6">Request Date & Time</ion-col>
              <ion-col size="6">{{dat.created_at}}</ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">Category</ion-col>
              <ion-col size="6">{{dat.cat_desc}}</ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">Sub Category</ion-col>
              <ion-col size="6">{{dat.subcat_desc}}</ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">Assigned to</ion-col>
              <ion-col size="6">{{dat.username}} {{dat.name}} {{dat.lname}}</ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">Urgency</ion-col>
              <ion-col size="6" style="padding-bottom: 12px">
                <span style="margin: 2px 5px;" [ngClass]="{'high': dat.priority === 'High', 'medium': dat.priority === 'Medium', 'low': dat.priority === 'Low'}">
                  {{dat.priority}}
                </span>

              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">Status</ion-col>
              <ion-col size="6" style="padding-top: 2px;">
                <span style="margin: 2px 5px;" [ngClass]="{'assigned': dat.stage_desc === 'Assigned', 'in_progress': dat.stage_desc === 'In progress'}">
                  {{dat.stage_desc}}
                </span>
              </ion-col>
            </ion-row>
          </div>
          <ion-row style="border-top: 1px solid rgb(199, 197, 197);margin-top:10px">
            <ion-col size="4" >
              <ion-button size="small" shape="round" fill="outline" (click)="openHistory(dat)">History</ion-button>
            </ion-col>
            <ion-col size="4" class="ion-text-center" *ngIf="status === 'assignto' || status === 'created' ">
              <ion-button size="small" shape="round" fill="outline" *ngIf="dat.show_asn_btn" [disabled]="dat.tckt_trip === '2' " (click)="assignUser(dat)">Assign</ion-button>
            </ion-col>
            <ion-col size="4" class="ion-text-center" *ngIf="(status === 'assignto' || status === 'created') && userData.id === dat.assign_to ">
              <ion-button size="small" shape="round" fill="outline" (click)="workNow(dat ,'action')">Work Now</ion-button>
            </ion-col>
            <ion-col size="8" class="ion-text-right" *ngIf="status === 'completed' && dat.tckt_status === 4 ">
              <ion-button size="small" shape="round" fill="outline" (click)="presentAlertConfirm(dat)" color="danger">RE-Open</ion-button>
            </ion-col>
          </ion-row>
          <!-- <ion-row>
            <ion-col size="6">
              <ion-text>Ext Id</ion-text><br>
              <ion-text>{{dat.ext_id}}</ion-text>
            </ion-col>
            <ion-col size="6">
              <ion-text>PC Desc</ion-text><br>
              <ion-text>{{dat.pc_desc}}</ion-text>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="4">
              <ion-button expand="block" color="secondary" (click)="openSite(dat)">Site</ion-button>
            </ion-col>
            <ion-col size="4">
              <ion-button expand="block" color="medium" (click)="openHistory(dat)">History</ion-button>
            </ion-col>
            <ion-col size="4">
              <ion-button expand="block" color="warning" (click)="workNow(dat)">Work Now</ion-button>
            </ion-col>
          </ion-row> -->
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>


</ion-content>
