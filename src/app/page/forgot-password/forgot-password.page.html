<ion-content class="center">
  <ion-row style="position:absolute;top:100px;width:100%">
    <ion-col class="ion-text-center">
      <img src="assets/img/white-logo.png" style="height:35px;width:210px">
    </ion-col>
  </ion-row>
  <div style="width:100%;height:100%;border-top:50vh solid var(--ion-color-primary);position: absolute;top:0px;z-index:-1"></div>
  <div style="height:100%;width:100%" class="center">
    <ion-card style="min-height:40vh;width:90vw;box-shadow: rgba(9, 30, 66, 0.25) 0px 4px 8px -2px, rgba(9, 30, 66, 0.08) 0px 0px 0px 1px;padding:20px;border-radius: 30px;" class="center">
      <section style="width:100%;min-height:40vh;" *ngIf="!isOtpSent && !isNewPass">
        <ion-row>
          <ion-col class="ion-no-padding">
            <ion-button fill="clear" (click)="popPage()" size="small">
              <ion-icon name="chevron-back-outline" slot="start" > </ion-icon> Back
            </ion-button>
          </ion-col>
        </ion-row>
        <h2>
          <ion-text color="dark">Forgot Password</ion-text>
        </h2>
        <p><ion-text color="primary">Please Enter your Email ID/Phone no to reset your password</ion-text></p>
        <section class="inputbox">
          <ion-text color="primary" >User ID</ion-text>
          <ion-item lines="none">
            <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
            <ion-input type="text" placeholder="Enter USER ID" [(ngModel)]="empid"> </ion-input>
          </ion-item>
        </section>
        <ion-row>
          <ion-col size="12" class="ion-text-center">
            <ion-button expand="block" color="primary" [disabled]="!empid" (click)="sendOtp()">Reset Password</ion-button>
          </ion-col>
        </ion-row>
      </section>
      <section style="width:100%;min-height:40vh;" *ngIf="isOtpSent && !isNewPass">
        <h3>Verification Code</h3>
        <p>
        We have sent a verification code to: {{lastNumber}}
        </p>
        <div class="ion-text-center">
          <img src="assets/otp_icon.png" style="height:100px;width:auto;margin:auto">
        </div>
        <ion-row>
          <ion-col size="12" class="ion-text-center">
            <span>Enter 4 Digit Code</span>
          </ion-col>
          <ion-col class="ion-text-center">
            <!-- <ng-otp-input  (onInputChange)="getOtpValue($event)" [config]="{length:4, allowNumbersOnly:true}"></ng-otp-input> -->
            <ng-otp-input  [config]="otpConfig" (onInputChange)="getOtpValue($event)"></ng-otp-input>
          </ion-col>
        </ion-row>
      </section>
      <section style="width:100%;min-height:40vh;" *ngIf="isNewPass" >
        <h3>
          <ion-text color="dark">Create New Password</ion-text>
        </h3>
        <br>
        <section class="inputbox">
          <ion-text color="primary" >Password</ion-text>
          <ion-item lines="none">
            <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
            <ion-input type="password" placeholder="Enter Password" [(ngModel)]="newPassword" (ionChange)="changePass()"></ion-input>
          </ion-item>
        </section>
        <br>
        <section class="inputbox">
          <ion-text color="primary" >Confirm Password</ion-text>
          <ion-item lines="none">
            <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
            <ion-input type="password" placeholder="Enter Confirm Password" [(ngModel)]="confirmPassword"></ion-input>
          </ion-item>
        </section>
        <!-- <ion-item >
          <ion-label position="floating">New Password</ion-label>
          <ion-input type="password" [(ngModel)]="newPassword" (ionChange)="changePass()"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Confirm Password</ion-label>
          <ion-input type="password" [(ngModel)]="confirmPassword"></ion-input>
        </ion-item> -->
        <br>
        <ion-row>
          <ion-col >
            <ion-button expand="block" color="primary" [disabled]="newPassword !== confirmPassword || !newPassword"  (click)="changePassword()">Update Password</ion-button>
          </ion-col>
        </ion-row>
      </section>
    </ion-card>
  </div>
</ion-content>
