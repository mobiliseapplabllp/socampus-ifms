<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Today Order</ion-title>
    <ion-buttons slot="end" *ngIf="id === '2'">
      <ion-button (click)="history()">History</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngFor="let dat of todayOrder" style="box-shadow: none;background-color:#0D1F9A0D;border-radius: 10px;margin: 10px;padding:10px">
    <ion-row>
      <ion-col size="1" class="ion-text-center">
        <div style="height:100%;width:5px;border-radius: 5px;background-color: #040E51; margin:auto"></div>
      </ion-col>
      <ion-col size="6" style="display: flex;align-items: center;">
        <div>
          <p>ORD ID: {{dat.order_id}}</p>
          <p>Type: {{dat.type_desc}} </p>
          <p>PC Name: {{dat.pc_desc}} </p>
          <p *ngIf="id === '2'">No of Boxes: <span style="color:green">{{dat.rec_camro_box}}</span>/{{dat.total_camro_box}} </p>
          <p *ngIf="id === '1'">No of Boxes: {{dat.total_camro_box}} </p>
          <p *ngIf="id === '2'" (click)="openDriverModal(dat)"><u>Driver Detail</u></p>
          <p>{{dat.order_status_label}} </p> <!--- {{dat.ord_status}}-->
        </div>
      </ion-col>
      <ion-col size="5" style="display: flex;align-items: center;">
        <div class="ion-text-right">
          <p>PC: {{dat.pc_ext_id}} </p>
          <ion-button class="ion-text-capitalize" *ngIf="id !== '1'" size="small" expand="block" (click)="viewBox(dat)" style="--border-radius: 10px;--background:rgba(177, 0, 0, 0.70)">View Box <ion-icon name="arrow-forward-outline" slot="end"></ion-icon></ion-button>
          <p *ngIf="id === '1'">
            <ion-button size="small" slot="icon-only" (click)="openGoogleMap(dat.latitude, dat.longitude)">
              <ion-icon name="location-outline"></ion-icon>
            </ion-button>
            <a href="tel:{{dat.cont_1}}" >
              <ion-button size="small" slot="icon-only">
                <ion-icon name="call-outline"></ion-icon>
              </ion-button>
            </a>
            <ion-button size="small" slot="icon-only" *ngIf="dat.ord_status === 6 || dat.ord_status === 9" [color]="dat.ord_status === 6 ? 'primary': 'success' " (click)="orderReached(dat)">
              <ion-icon name="checkmark-outline"></ion-icon>
            </ion-button>
          </p>
          <ion-button *ngIf="dat.challan_btn_show === 1" size="small" (click)="challan(dat)">Challan</ion-button>
        </div>
      </ion-col>
    </ion-row>
  </ion-card>

  <div *ngIf="todayOrder.length === 0 && isApiHit" style="padding-top:100px">
    <ion-row>
      <ion-col class="ion-text-center">
        <img src="assets/img/no_data_found.gif" style="height:100px;width:100px;"><br>
        <h3>No Data Found </h3>
      </ion-col>
    </ion-row>
  </div>

</ion-content>
