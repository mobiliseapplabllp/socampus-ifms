<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Order Received</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-card style="box-shadow: none;background-color: #B10000B2;border-radius: 10px;margin: 10px; color:white">
    <ion-item lines="none" color="none">
      <ion-label slot="start" class="ion-text-wrap">
        <p><ion-text color="light">OD192</ion-text></p>
        <p><ion-text color="light">Pick Time: 11:00</ion-text></p>
        <p><ion-text color="light">Delivery Time: 12:00</ion-text></p>
        <p><ion-text color="light">No of Boxes: 125/05</ion-text></p>
      </ion-label>
      <ion-label slot="end" class="ion-text-wrap">
        <p><ion-text color="light">PC: 1000045</ion-text></p>
        <p><ion-text color="light">GOOGLE CAMPUS</ion-text></p>
        <ion-button color="dark" class="ion-text-capitalize" slot="end">125/05</ion-button>
      </ion-label>
    </ion-item>
  </ion-card>

  <ion-item *ngFor="let dat of order_details;let i = index" lines="full">
    <ion-row>
      <ion-col size="1" class="center">{{i}}</ion-col>
      <ion-col size="4">
        <p>{{dat.item_code}}</p>
        <p>{{dat.item_name}}</p>
        <p>{{dat.item_qty}} <img [src]="dat.cat_img" style="height:10px;width:10px"> </p>
      </ion-col>
      <ion-col size="5">
        <section >
          <ion-text color="prime" style="font-size:10px;font-weight: 550;">Received Qty </ion-text>
          <ion-item lines="none"  class="ion-no-padding" style="border: 1px solid #D9E1EB;height:30px;border-radius: 6px;padding-left: 6px">
            <ion-input type="number" style="height:28px;font-weight: 530;font-size:12px"> </ion-input>
          </ion-item>
        </section>
      </ion-col>
      <ion-col size="2" class="center">
        <ion-button fill="clear">
          <ion-icon name="barcode-outline"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-item>
