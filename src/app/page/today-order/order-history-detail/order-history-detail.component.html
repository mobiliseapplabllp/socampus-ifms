<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Order Details</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>

  <ion-card style="box-shadow: none;background-color: #B10000B2;border-radius: 10px;margin: 10px; color:white">
    <ion-item lines="none" color="none">
      <ion-label slot="start" class="ion-text-wrap">
        <p><ion-text color="light">ORD ID: {{requestedData.order_id}}</ion-text></p>
        <p><ion-text color="light">PC Name: {{requestedData.pc_name}}</ion-text></p>
      </ion-label>
      <ion-label slot="end" class="ion-text-wrap">
        <p><ion-text color="light">Amount:  {{requestedData.order_amt}}</ion-text></p>
        <p><ion-text color="light">Type: {{requestedData.type_desc}}</ion-text></p>
      </ion-label>
    </ion-item>
  </ion-card>

  <ion-card *ngFor="let dat of myData;let i = index" >
    <ion-row >
      <ion-col size="7" style="display: flex;align-items: center;">
        <div style="height:20px;width:20px;border-radius: 50%;background-color:#040E51;color:#fff;font-size:12px;padding:3px;margin:5px" class="center">{{i+1}}</div>
        <b>{{dat.item_name}}</b><br>
      </ion-col>
      <ion-col size="1" class="center" >
        <img [src]="dat.cat_image" style="height:10px;width:10px;" *ngIf="dat.cat_image">
      </ion-col>
      <ion-col size="3">
        <div>
          <span>Temperature</span>
          <ion-input type="number" [(ngModel)]="dat.temperature" readonly> </ion-input>
        </div>
      </ion-col>
    </ion-row>
    <div>
      <ion-row *ngFor="let val of dat.cambro_dtl; let j = index" style="border-bottom:1px solid #d7d4d4">
        <ion-col size="8" style="display: flex; align-items: center;" class="ion-padding-start">
          <div>
            <p>Cambro: {{val.ext_asset_id}}</p>
            <p><span>Qty: {{val.dispatch_qty}}</span></p>
          </div>
        </ion-col>
        <ion-col size="3">
          <div>
            <span>Recieved Qty </span>
            <ion-input type="number" [(ngModel)]="val.received_qty" readonly> </ion-input>
          </div>
        </ion-col>
      </ion-row>
    </div>
  </ion-card>
