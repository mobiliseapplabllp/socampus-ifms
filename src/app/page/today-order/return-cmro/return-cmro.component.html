<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Return Cambro</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-item (click)="openSiteModal()">
    <ion-label color="primary" position="floating">Select Site <ion-text color="danger">*</ion-text></ion-label>
    <ion-input type="text" [(ngModel)]="site_desc" readonly></ion-input>
  </ion-item>
  <ion-row>
    <ion-col class="ion-text-center">
      <ion-button shape="round" (click)="search()">Search <ion-icon name="search-outline" slot="end"></ion-icon> </ion-button>
    </ion-col>
  </ion-row>
  <ion-row *ngIf="returnCambroArr.length > 0">
    <ion-col class="ion-text-right ion-padding-right">
      <ion-button size="small" (click)="selectAll()">Select All</ion-button>
    </ion-col>
  </ion-row>
  <ion-item *ngFor="let dat of returnCambroArr">
    <ion-checkbox [(ngModel)]="dat.isSelect" (ionChange)="changeCheckbox()" slot="start"> </ion-checkbox>
    <ion-label class="ion-text-wrap">
      <h3>Cambro ID: {{dat.cambro_id}}</h3>
      <p>Order ID: {{dat.order_id}}</p>
      <p>PC ID: {{dat.pc_id}}</p>
      <p>Description: {{dat.type_desc}}</p>
    </ion-label>
    <ion-button slot="end" (click)="returnAction(dat)" [hidden]="dat.isSelect">Return Cambro</ion-button>
  </ion-item>
  <ion-row>
    <ion-col class="ion-padding-start ion-padding-end ion-text-center" *ngIf="isShowButton">
      <ion-button (click)="returnAll()" shape="round">Return All</ion-button>
    </ion-col>
  </ion-row>
