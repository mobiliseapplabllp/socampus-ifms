<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Order Packing</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>

  <ion-slides [options]="slideBanner" style="padding-top:10px">
    <ion-slide *ngFor="let dat of dateArr" style="padding:0px">
      <div style="width:40px;height:70px;border-radius: 20px;" [ngClass]="{'black': dat.isSelect, 'medium': !dat.isSelect}" (click)="changeDate(dat)">
        <section style="width:40px;height:35px;padding:2px !important">
          <span class="center" style="height:35px;width:100%;border-radius: 20px;font-size:11px;font-weight: 550;" [ngClass]="{'white': dat.isSelect, 'dark': !dat.isSelect}">
            {{dat.day}}
          </span>
        </section>
        <section style="width:100%;height:35px;font-size:14px;font-weight: 550;" class="center" [ngClass]="{'text-white': dat.isSelect}">
          {{dat.date}}
        </section>
      </div>
    </ion-slide>
  </ion-slides>

  <ion-card *ngFor="let dat of packingArr" class="cards">
    <ion-row>
      <ion-col size="1" class="ion-text-center">
        <div style="height:100%;width:5px;border-radius: 5px;background-color: #040E51; margin:auto"></div>
      </ion-col>
      <ion-col size="6" style="display: flex;align-items: center;">
        <div>
          <p><ion-text class="key">Order ID: </ion-text> <ion-text class="value">{{dat.order_id}}</ion-text> </p>
          <p><ion-text class="key">Type: </ion-text> <ion-text class="value">{{dat.type_desc | uppercase}}</ion-text>   </p>
          <p><ion-text class="key">PC Id:</ion-text> <ion-text class="value">{{dat.pc_id}}-{{dat.pc_desc}}</ion-text> </p>
        </div>
      </ion-col>
      <ion-col size="5" style="display: flex;align-items: center;">
        <div>
          <ion-button size="small" class="ion-text-capitalize" color="success" (click)="openPage(dat)">View Items <ion-icon name="arrow-forward-outline" slot="end"></ion-icon> </ion-button>
        </div>
        <!-- <div>
          <p><ion-text class="key">Excepted Dispatch Time</ion-text> <ion-text class="value">{{dat.expected_dispatch_time}}</ion-text> </p>
          <p><ion-text class="key">Expected Packing Time: </ion-text> <ion-text class="value">{{dat.expected_packing_time | uppercase}}</ion-text>   </p>
          <p><ion-text class="key">Expected Preparation Time:</ion-text> <ion-text class="value">{{dat.expected_preparation_time}}</ion-text> </p>
        </div> -->
      </ion-col>
    </ion-row>
  </ion-card>

  <div *ngIf="packingArr.length === 0 && isApiHit" style="padding-top:100px">
    <ion-row>
      <ion-col class="ion-text-center">
        <img src="assets/img/no_data_found.gif" style="height:100px;width:100px;"><br>
        <h3>No Data Found </h3>
      </ion-col>
    </ion-row>

  </div>


</ion-content>
