<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Order Packing</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>

  <ion-slides [options]="slideBanner" style="padding-top:10px">
    <ion-slide *ngFor="let dat of dateArr" style="padding:0px">
      <div style="width:40px;height:70px;border-radius: 20px;" [ngClass]="{'black': dat.isSelect, 'medium': !dat.isSelect}" (click)="changeDate(dat)">
        <section style="width:40px;height:35px;padding:2px !important">
          <span class="center" style="height:35px;width:100%;border-radius: 20px;font-size:11px;font-weight: 550;" [ngClass]="{'white': dat.isSelect, 'dark': !dat.isSelect}">
            {{dat.day}}
          </span>
        </section>
        <section style="width:100%;height:35px;font-size:14px;font-weight: 550;" class="center" [ngClass]="{'text-white': dat.isSelect}">
          {{dat.date}}
        </section>
      </div>
    </ion-slide>
  </ion-slides>

  <ion-card *ngFor="let dat of packingArr" class="order-card" (click)="openPage(dat)">
    <div class="order-card__accent"></div>
    <div class="order-card__body">
      <div class="order-card__head">
        <div class="order-id"><span class="hash">#</span>{{dat.order_id}}</div>
        <span class="type-chip" *ngIf="dat.type_desc">{{dat.type_desc | uppercase}}</span>
      </div>

      <div class="order-card__pc">
        <ion-icon name="location-outline"></ion-icon>
        <span>{{dat.pc_id}} · {{dat.pc_desc}}</span>
      </div>

      <div class="order-card__meta" *ngIf="dat.expected_packing_time || dat.expected_dispatch_time">
        <span class="meta" *ngIf="dat.expected_packing_time">
          <ion-icon name="cube-outline"></ion-icon> Pack {{dat.expected_packing_time}}
        </span>
        <span class="meta" *ngIf="dat.expected_dispatch_time">
          <ion-icon name="car-outline"></ion-icon> Dispatch {{dat.expected_dispatch_time}}
        </span>
      </div>

      <div class="order-card__foot">
        <ion-button size="small" fill="solid" class="view-btn ion-text-capitalize" (click)="openPage(dat); $event.stopPropagation()">
          View Items <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
        </ion-button>
      </div>
    </div>
  </ion-card>

  <div *ngIf="packingArr.length === 0 && isApiHit" style="padding-top:100px">
    <ion-row>
      <ion-col class="ion-text-center">
        <img src="assets/img/no_data_found.gif" style="height:100px;width:100px;"><br>
        <h3>No Data Found </h3>
      </ion-col>
    </ion-row>

  </div>


</ion-content>
