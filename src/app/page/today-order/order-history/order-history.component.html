<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title> Order History</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>

  <ion-slides [options]="slideBanner" style="padding-top:10px">
    <ion-slide *ngFor="let dat of dateArr" style="padding:0px">
      <div style="width:40px;height:70px;border-radius: 20px;" [ngClass]="{'black': dat.isSelect, 'medium': !dat.isSelect}" (click)="changeDate(dat)">
        <section style="width:40px;height:35px;padding:2px !important">
          <span class="center" style="height:35px;width:100%;border-radius: 20px;font-size:11px;font-weight: 550;" [ngClass]="{'white': dat.isSelect, 'dark': !dat.isSelect}">
            {{dat.day}}
          </span>
        </section>
        <section style="width:100%;height:35px;font-size:14px;font-weight: 550;" class="center" [ngClass]="{'text-white': dat.isSelect}">
          {{dat.date}}
        </section>
      </div>
    </ion-slide>
  </ion-slides>

  <ion-card *ngFor="let dat of history" style="box-shadow: none;background-color:#0D1F9A0D;border-radius: 10px;margin: 10px;padding:10px">
    <ion-row>
      <ion-col size="1" class="ion-text-center">
        <div style="height:100%;width:5px;border-radius: 5px;background-color: #040E51; margin:auto"></div>
      </ion-col>
      <ion-col size="6" style="display: flex;align-items: center;">
        <div>
          <p>ORD ID: {{dat.order_id}}</p>
          <p>PC Name: {{dat.pc_desc}} </p>
          <p>No of Cambro Boxes: {{dat.total_camro_box}} </p>
          <p><u>Driver Detail</u></p>
          <p>{{dat.order_status_label}} - {{dat.ord_status}}</p>
        </div>
      </ion-col>
      <ion-col size="5" style="display: flex;align-items: center;">
        <div class="ion-text-right">
          <p>PC: {{dat.pc_ext_id}} </p>
          <ion-button class="ion-text-capitalize" size="small" expand="block" (click)="orderDetails()" style="--border-radius: 10px;--background:rgba(177, 0, 0, 0.70)">View Box <ion-icon name="arrow-forward-outline" slot="end"></ion-icon></ion-button>
          <p *ngIf="id === '1'">
            <ion-button size="small" slot="icon-only" >
              <ion-icon name="location-outline"></ion-icon>
            </ion-button>
            <a href="tel:{{dat.cont_1}}" >
              <ion-button size="small" slot="icon-only">
                <ion-icon name="call-outline"></ion-icon>
              </ion-button>
            </a>
            <ion-button size="small" slot="icon-only" *ngIf="dat.ord_status === 6" >
              <ion-icon name="checkmark-outline"></ion-icon>
            </ion-button>
          </p>
        </div>
      </ion-col>
    </ion-row>
  </ion-card>
