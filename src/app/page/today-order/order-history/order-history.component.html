<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title> Order History</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>

  <ion-slides [options]="slideBanner" style="padding-top:10px">
    <ion-slide *ngFor="let dat of dateArr" style="padding:0px">
      <div style="width:40px;height:70px;border-radius: 20px;" [ngClass]="{'black': dat.isSelect, 'medium': !dat.isSelect}" (click)="changeDate(dat)">
        <section style="width:40px;height:35px;padding:2px !important">
          <span class="center" style="height:35px;width:100%;border-radius: 20px;font-size:11px;font-weight: 550;" [ngClass]="{'white': dat.isSelect, 'dark': !dat.isSelect}">
            {{dat.day}}
          </span>
        </section>
        <section style="width:100%;height:35px;font-size:14px;font-weight: 550;" class="center" [ngClass]="{'text-white': dat.isSelect}">
          {{dat.date}}
        </section>
      </div>
    </ion-slide>
  </ion-slides>

  <ion-card *ngFor="let dat of history" style="box-shadow: none;background-color:#0D1F9A0D;border-radius: 10px;margin: 10px">
    <ion-item lines="none" color="none">
      <div style="width:5px;height:60px;background-color:black;border-radius: 20px; margin:5px" slot="start"></div>
      <ion-label slot="start" class="ion-text-wrap">
        <p><ion-text>{{dat.order_id}}</ion-text></p>
        <p><ion-text>Pick Time: {{dat.pick_time}}</ion-text></p>
        <p><ion-text>Delivery Time: {{dat.delivery_time}}</ion-text></p>
        <p><ion-text>No of Boxes: {{dat.box}}</ion-text></p>
      </ion-label>
      <ion-label slot="end" class="ion-text-wrap">
        <p><ion-text>PC: {{dat.pc}}</ion-text></p>
        <p><ion-text>{{dat.location}}</ion-text> <ion-icon name="location-outline" color="danger"></ion-icon> </p>
        <ion-button [color]="dat.color" class="ion-text-capitalize" (click)="status()" expand="block" (click)="orderDetails()">
          <ion-text *ngIf="dat.color === 'danger'">Pending</ion-text>
          <ion-text *ngIf="dat.color === 'success'">Completed</ion-text>
        </ion-button>
      </ion-label>
    </ion-item>
  </ion-card>

</ion-content>
