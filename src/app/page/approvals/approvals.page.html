<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Approvals</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="approvals-content">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="approval-grid">
    <button type="button" class="approval-tile ion-activatable" *ngFor="let val of approvalsList" (click)="openPage(val)">
      <span class="approval-tile__badge" *ngIf="val.count > 0">{{ val.count > 99 ? '99+' : val.count }}</span>
      <span class="approval-tile__icon">
        <img [src]="val.icon" alt="">
      </span>
      <span class="approval-tile__label">{{ val.label }}</span>
      <ion-ripple-effect></ion-ripple-effect>
    </button>
  </div>
</ion-content>
