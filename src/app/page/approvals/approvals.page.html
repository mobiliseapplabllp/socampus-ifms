<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Approvals</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <ion-grid>
    <ion-row  style="padding:2px;margin:0px !important;">
      <ion-col *ngFor="let val of approvalsList" size="4" style="margin:3px 0px">
        <ion-card style="margin:0px; min-height: 80px;width:100%; box-shadow:1px 1px 8px #26589c;border-radius: 10px;position: relative;" (click)="openPage(val)">
          <span *ngIf="val.count > 0" style="position:absolute;background-color: var(--ion-color-danger);padding:3px;border-radius: 4px;top:5px;right:5px;color:var(--ion-color-dark)">{{val.count}}</span>
          <div style="height:60px;width:100%" class="center">
            <ion-img [src]="val.icon" style="height:35px;width:35px"></ion-img>
          </div>
          <div style="min-height:20px;width:100%" class="center">
            <ion-text color="primary" style="font-weight: 500;"> {{val.label}}</ion-text>
          </div>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
