<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>PPM Hold Approvals({{data.length}})</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="apv-content">
  <div class="apv-card" *ngFor="let dat of data">
    <div class="apv-card__header">
      <div class="apv-card__ticket">
        <ion-icon name="construct-outline"></ion-icon>
        <span>PPM #{{dat.ppm_work_order_id}}</span>
      </div>
    </div>

    <div class="apv-card__body">
      <div class="apv-field apv-field--full">
        <span class="apv-field__label">Site Name</span>
        <span class="apv-field__value">{{dat.pc_desc || '—'}}</span>
      </div>
      <div class="apv-field">
        <span class="apv-field__label">Hold By</span>
        <span class="apv-field__value">{{dat.hold_by_name}} {{dat.hold_by_lname}}</span>
      </div>
      <div class="apv-field">
        <span class="apv-field__label">Hold Request Date</span>
        <span class="apv-field__value">{{dat.hold_date || '—'}}</span>
      </div>
      <div class="apv-field apv-field--full">
        <span class="apv-field__label">Assign To</span>
        <span class="apv-field__value">{{dat.assigned_name || '—'}}</span>
      </div>
      <div class="apv-field apv-field--full">
        <span class="apv-field__label">Reason For Hold</span>
        <span class="apv-field__value">{{dat.hold_remark || '—'}}</span>
      </div>
      <button type="button" class="apv-attach" *ngIf="dat.hold_attachment" (click)="openDoc(dat.hold_attachment, dat.hold_attachment_blob_type)">
        <ion-icon name="attach-outline"></ion-icon>
        <span>View Attachment</span>
      </button>
    </div>

    <div class="apv-card__actions">
      <ion-button expand="block" shape="round" fill="outline" color="danger" class="ion-text-capitalize" (click)="presentAlertConfirm(dat, '2', 'Reject')">
        <ion-icon name="close-outline" slot="start"></ion-icon>
        Reject
      </ion-button>
      <ion-button expand="block" shape="round" fill="solid" color="success" class="ion-text-capitalize" (click)="presentAlertConfirm(dat, '1', 'Approve')">
        <ion-icon name="checkmark-outline" slot="start"></ion-icon>
        Approve
      </ion-button>
    </div>
  </div>
</ion-content>
