<ion-header>
  <ion-toolbar >
    <ion-title>Upload PTW ({{data.wo_no}})</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal(null, false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <section class="inputbox">
    <ion-text color="primary" >Enter Remark</ion-text>
    <ion-item lines="none" style="border:2px solid rgba(42, 41, 92, 0.20);">
      <ion-textarea rows="3" type="text" placeholder="Enter Remark here..." [(ngModel)]="remark"> </ion-textarea>
    </ion-item>
  </section>

  <ion-row>
    <ion-col size="12">
      <ion-text color="primary" style="font-size:12px; font-family: 'opensans_medium' !important;">You can use one attachment option between the photo or document</ion-text>
    </ion-col>
    <ion-col size="4">
      <ion-button [color]="img_temp ? 'success': 'primary'" shape="round" fill="outline" (click)="presentActionSheet()">
        Photo  <ion-icon [name]="img_temp ? 'checkmark-done-outline' : 'attach-outline'"></ion-icon>
      </ion-button>
    </ion-col>
    <ion-col size="8" class="ion-text-right">
      <label for="choose-file3" class="custom-file-upload" id="choose-file-label"
      [ngClass]="{'custom-file-upload': !doc_temp, 'custom-file-upload-succ': doc_temp}"> Upload Document </label><br><ion-text color="success" style="font-size:10px">{{doc_temp}}</ion-text>
      <input name="uploadDocument" type="file" id="choose-file3"
        accept=".jpg,.jpeg,.pdf,doc,docx,application/msword,.png" style="display: none;" (change)="changeFile($event)" />
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col class="ion-text-center">
      <ion-button color="primary" expand="block" (click)="uploadPtw()">Submit <ion-icon name="chevron-forward-outline" slot="end"></ion-icon></ion-button>
    </ion-col>
  </ion-row>
</ion-content>
