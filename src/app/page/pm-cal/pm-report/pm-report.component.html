<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title id="open-modal" > WO-{{requestedData.wo_no}} </ion-title>
    <ion-buttons slot="end" *ngIf="loop">
      <ion-button (click)="stopSpeaker()" color="danger">Stop <ion-icon name="volume-high-outline" slot="end"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-row>
    <ion-col size="6" class="ion-padding-start ion-padding-top"> Category({{myCategory.length}})</ion-col>
    <ion-col size="6" class="ion-text-right ion-padding-end ion-padding-top">Selected({{selectedCategory}})</ion-col>
  </ion-row>
  <ion-card *ngFor="let dat of myCategory; let ind = index" [ngClass]="{fullborder: dat.isError === true}" style="border-left:5px solid #915FC8;box-shadow: rgba(0, 0, 0, 0.05) 0px 6px 24px 0px, rgba(0, 0, 0, 0.08) 0px 0px 0px 1px;">
    <ion-item>
      <ion-label class="ion-text-wrap">{{ind+1}}. {{dat.cat_desc}}</ion-label>
      <ion-toggle slot="end" [(ngModel)]="dat.is_applicable_temp" (ionChange)="changeToggle(dat, ind)"></ion-toggle>
    </ion-item>
    <ion-row  (click)="openQusPage(dat)" [ngClass]="{'disabled-card': !dat.is_applicable_temp}"><!--[ngClass]="{'disabled-card': !dat.is_applicable_temp}"-->
      <ion-col size="9">Question</ion-col>
      <ion-col size="3" class="ion-text-right ion-padding-right">{{dat.responded_questions}}/{{dat.total_questions}}</ion-col>
      <ion-col size="12">
        <ion-progress-bar [color]="dat.responded_questions === dat.total_questions ? 'success': 'warning' " [value]="(dat.responded_questions * 100 / dat.total_questions)/100 "></ion-progress-bar>
      </ion-col>
    </ion-row>
  </ion-card>
</ion-content>
<ion-footer class="ion-no-border">
  <ion-toolbar color="light" style="padding: 0px 10px">
    <ion-button expand="block" color="primary" (click)="finalSubmit()">Submit <ion-icon name="arrow-forward" slot="end"></ion-icon> </ion-button>
  </ion-toolbar>
</ion-footer>

  <ion-row *ngIf="myCategory.length > 0">
    <ion-col class="ion-text-center">

  <div *ngFor="let dat of myCategory; let ind = index" [ngClass]="{fullborder: dat.isError === true}">
    <div id={{ind}}>
      <section style="background-color:var(--ion-color-light); margin:3px;border:2px solid var(--ion-color-medium);border-radius: 6px;box-shadow: 1px 1px 3px rgb(101, 98, 98);">
        <ion-item color="none" lines="none">
          <ion-label class="ion-text-wrap">  <b> {{ind + 1}}. {{dat.cat_desc}} </b></ion-label>
          <ion-button slot="end" fill="clear" (click)="actionCategory(dat, ind, 0)">
            <ion-icon [name]="dat.bgcolor ? 'volume-mute-outline': 'volume-high-outline'" [color]="dat.bgcolor ? 'danger': 'dark'"></ion-icon>
          </ion-button>
        </ion-item>
        <ion-row>
          <ion-col size="5" style="font-size:large;font-weight: 500;display: flex; align-items: center; padding-left: 10px">Applicable</ion-col>
          <ion-col class="ion-text-right">
            <ion-button size="small" [fill]="dat.is_applicable === 3 ? 'solid': 'outline'" shape="round" (click)="notApplicable(dat)" [color]="dat.is_applicable === 3 ? 'success': 'medium'" [disabled]="dat.is_applicable === 3">
              NA <ion-icon *ngIf="dat.is_applicable === 3" name="checkmark-outline" slot="end"></ion-icon>
            </ion-button>
            <ion-button size="small" [fill]="dat.is_applicable === 1 ? 'solid': 'outline'" shape="round" (click)="expand(dat, ind)" [color]="dat.is_applicable === 1 ? 'success': 'medium'" [disabled]="dat.is_applicable === 1">
              YES <ion-icon *ngIf="dat.is_applicable === 1" name="checkmark-outline" slot="end"></ion-icon>
            </ion-button>
            <ion-button size="small" shape="round" color="secondary" fill="outline" *ngIf="dat.is_applicable === 1" (click)="viewMore(dat, ind)">
              <ion-icon [name]="!dat.isResponseShow ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
            </ion-button>
          </ion-col>
        </ion-row>
      </section>
    </div>

    <div *ngIf="dat.isResponseShow" class="ion-no-padding">
      <div style="margin:10px;padding:5px 0px ;border:1px solid black;border-radius: 10px;" *ngFor="let val of dat.qus; let i = index" [ngClass]="{critical: val.critical_desc === 'Critical', noncritical: val.critical_desc === 'Non Critical', fullborder: val.isNotFill === true, bgcolor: val.bgcolor === true}">
        <div id={{ind}}{{i}}></div>
        <ion-item color="none">
          <ion-avatar class="center">
            <b>{{i+1}}</b>
          </ion-avatar>
          <ion-label class="ion-text-wrap" [innerHTML]="val.q_desc"></ion-label>
          <ion-button slot="end" fill="clear" (click)="actionSpeak(val, ind, i)">
            <ion-icon name="volume-high-outline"></ion-icon>
          </ion-button>
        </ion-item>
        <ion-item *ngIf="val.is_correct === 0" color="none">
          <ion-label class="ion-text-wrap">
            <b>Requirement:</b> {{val.requirement}}<br>
            <ion-text color="primary">{{val.critical_desc}}</ion-text> (<ion-text color="primary">{{val.scope_desc}}</ion-text>)
          </ion-label>
          <ion-text slot="end" *ngIf="val.sla !== 0 ">
            {{val.sla}}: Days
          </ion-text>
        </ion-item>
        <ion-row>
          <ion-col>
            <ion-radio-group *ngIf="val.q_type === '226'" [(ngModel)]="val.rspns" (ionChange)="changeOptionResponse(val, $event)" color="none" mode="md">
              <ion-row>
                <ion-col size="4" *ngFor="let opt of val.options">
                  <ion-item lines="none">
                    <ion-label> {{opt.optn_desc}}</ion-label>
                    <ion-radio slot="start" [value]="opt.optn_id" style="margin-right:3px"></ion-radio>
                  </ion-item>
                </ion-col>
              </ion-row>
            </ion-radio-group>
          </ion-col>
        </ion-row>
        <ion-item [ngClass]="{redBorder: val.is_rmrk_mandatory === 1 && !val.remark}" color="none">
          <ion-input type="email" [(ngModel)]="val.remark" placeholder="Enter Remark" [disabled]="!val.rspns" (change)="changeRemark(val)"></ion-input>
        </ion-item>
        <ion-row>
          <ion-col class="ion-text-left" size="6" >

              <ion-icon name="checkmark-done-outline" slot="end" *ngIf="val.imagename"></ion-icon>
            </ion-button>
          </ion-col>
          <ion-col *ngIf="val.attachment" class="ion-text-right">

              <ion-icon name="attach-outline"></ion-icon>
            </ion-button>
          </ion-col>
        </ion-row>
      </div>
    </div>
  </div>
