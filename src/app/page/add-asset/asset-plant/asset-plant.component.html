<ion-header mode="md">
  <ion-toolbar color="primary">
    <ion-title>Site({{plantNameCopy.length}})</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal(null, false)">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar mode="md" (ionChange)="search($event)" debounce="1000"></ion-searchbar>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-virtual-scroll [items]="plantName" approxItemHeight="320px">
    <ion-item *virtualItem="let item; let itemBounds = bounds;" (click)="closeModal(item, true)">
      {{item.pc_ext_id}}-{{item.pc_desc}}
    </ion-item>
  </ion-virtual-scroll>
</ion-content>
