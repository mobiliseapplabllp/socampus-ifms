<ion-header mode="md">
  <ion-toolbar color="primary">
    <ion-title>Device Name({{myDeviceNameCopy.length}})</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal(null, false)">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar (ionChange)="search($event)" mode="md"></ion-searchbar>
  </ion-toolbar>
</ion-header>
<ion-content>

  <!-- <ion-list>
    <ion-item *ngFor="let dat of myDeviceName" (click)="closeModal(dat, true)">
      {{dat.label}}
    </ion-item>
  </ion-list> -->
  <ion-virtual-scroll [items]="myDeviceName" approxItemHeight="320px">
    <ion-item *virtualItem="let item; let itemBounds = bounds;" (click)="closeModal(item, true)">
      {{item.label}}
    </ion-item>
  </ion-virtual-scroll>
</ion-content>
