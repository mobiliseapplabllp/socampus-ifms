<ion-header>
  <ion-toolbar color="primary">
    <ion-title> Justification </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <div *ngIf="view_status === 'add' ">
    <ion-item>
      <ion-label position="floating">Remark <ion-text color="danger">*</ion-text></ion-label>
      <ion-textarea rows="2" [(ngModel)]="remark"></ion-textarea>
    </ion-item>    
    <ion-button class="ion-margin-start" shape="round" (click)="openCamera()" [color]="image ? 'success': 'primary' ">Attachment</ion-button>
    <br>
    <ion-row>
      <ion-col>
        <ion-button expand="block" (click)="submit()">Submit</ion-button>
      </ion-col>
    </ion-row>
  </div>

  <div *ngIf="view_status === 'view'">
    <ion-card>
      <ion-row>
        <ion-col size="6" color="dark">Submitted By </ion-col>
        <ion-col>{{view_obj.submitted_by}}</ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="6" color="dark">Submitted At </ion-col>
        <ion-col>{{view_obj.submitted_at}}</ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="6" color="dark">Remark </ion-col>
        <ion-col>{{view_obj.remark}}</ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="4">
          <ion-button size="small" (click)="openImg(view_obj.attachment)" expand="block">Attachment</ion-button>
        </ion-col>
        <ion-col size="4">
          <ion-button size="small" (click)="changeEdit()" color="secondary" expand="block">Edit</ion-button>
        </ion-col>
        <ion-col size="4">
          <ion-button size="small" (click)="presentAlert(view_obj.id)" color="danger" expand="block">Delete</ion-button>
        </ion-col>
      </ion-row>
    </ion-card>
    
  </div>
</ion-content>
