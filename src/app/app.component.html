<ion-app>
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar color="primary" style="padding:2%">
        <h4>{{userInfo.user_name}}</h4>
        <p>{{userInfo.username}} {{userInfo.user_type}}</p>
        <div class="punch-wrapper">
          <span  class="label punch-out-text">Punch Out</span>
          <ion-toggle color="success" [checked]="isPunchIn" (ionChange)="togglePunch($event)" [class.punch-in]="isPunchIn" [class.punch-out]="!isPunchIn"> </ion-toggle>
          <span class="label punch-in-text">Punch In</span>
        </div>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list >
        <ion-menu-toggle *ngFor="let dat of myMenu let i = index" (click)="openPage(dat)">
          <ion-item lines="none" >
            <img [src]="dat.icon_path" slot="start" style="width:30px; height:30px">
            <ion-label>{{dat.smnu_desc}}</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-item lines="none" (click)="logout()">
          <ion-icon name="log-out-outline" style="width:30px; height:30px" slot="start" color="dark"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
    <ion-footer>
      <ion-toolbar color="light">
        <ion-title class="ion-text-center" size="small" (click)="appUrl()"> V {{appVersion}} </ion-title>
      </ion-toolbar>
    </ion-footer>
  </ion-menu>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
