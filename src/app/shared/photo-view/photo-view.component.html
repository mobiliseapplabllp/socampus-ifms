<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Photo View</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal(null, false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <img [src]="imageUrl" alt="Image from Blob" style="height:100%;width:100%;object-fit:contain">
</ion-content>
