<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="video-preview-content">
  <div class="video-preview-stage">
    <div *ngIf="loading" class="video-preview-state">
      <ion-spinner name="crescent" color="light"></ion-spinner>
      <p>Loading video...</p>
    </div>
    <div *ngIf="!loading && errorMsg" class="video-preview-state">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <p>{{ errorMsg }}</p>
    </div>
    <video *ngIf="src" [src]="src" controls autoplay playsinline class="video-preview-player" (error)="onVideoError($event)"></video>
  </div>
</ion-content>
