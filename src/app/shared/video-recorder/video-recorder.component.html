<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Record Video</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="video-recorder-content">
  <div class="video-recorder-stage">
    <video #preview autoplay muted playsinline class="video-recorder-preview"></video>
    <ion-spinner *ngIf="starting" name="crescent" color="light" class="video-recorder-spinner"></ion-spinner>
    <div *ngIf="!starting" class="video-recorder-timer" [class.is-recording]="recording">
      <span *ngIf="recording" class="video-recorder-dot"></span>
      {{ elapsed | times }} / {{ maxSeconds | times }}
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <ion-button *ngIf="!recording" expand="block" shape="round" color="primary" [disabled]="starting" (click)="start()">
      <ion-icon name="videocam-outline" slot="start"></ion-icon>
      Start Recording
    </ion-button>
    <ion-button *ngIf="recording" expand="block" shape="round" color="danger" (click)="stop()">
      <ion-icon name="stop-circle-outline" slot="start"></ion-icon>
      Stop
    </ion-button>
  </ion-toolbar>
</ion-footer>
