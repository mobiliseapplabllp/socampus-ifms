
  <div  *ngIf="!conversation"  class="ion-text-center">
    <ion-button (click)="getOrcreateConversation('environment')" [disabled]="isProcess">Join LIVE Call <ion-spinner name="lines" slot="end" *ngIf="isProcess"></ion-spinner></ion-button>
  </div>
  <div *ngIf="conversation" style="height:100%;width:100%">
    <div id="remote-container" style="z-index: 1">
    </div>
    <div id="local-container" style="height:200px;width:200px;border-radius: 10px;z-index:2;position: absolute; bottom: 5px; right:5px ">
      <video #localVideo autoplay playsinline style="height:100%;width:100%;"  muted="muted"></video>
    </div>
    <ion-button size="small" style="z-index: 2;position: absolute;top:5px; right:5px" color="danger" (click)="LeaveCall()">Leave Call</ion-button>
  </div>
