<ion-header mode="md" class="ion-no-border">
  <ion-toolbar color="background">
    <ion-title>PDF View</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal(null, false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <pdf-viewer [src]="pdfSrc" [render-text]="true" [original-size]="false" style="width: 100%; height: 100%"></pdf-viewer>
</ion-content>
