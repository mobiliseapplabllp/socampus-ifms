<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start" *ngIf="isProcessing">
      <ion-button color="danger">Uploading <ion-spinner slot="end" name="lines-sharp"></ion-spinner> </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal(null, false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="video-container" *ngIf="isCameraOpen">
    <video #videoElement class="videoElement" autoplay></video>
  </div>
</ion-content>
<ion-footer>
  <ion-row>
    <ion-col size="4" class="center">
      <ion-button size="small" fill="clear" color="danger" *ngIf="splitCount > 0">
        Uploaded({{splitCount}})
      </ion-button>
    </ion-col>
    <ion-col size="4" class="ion-text-center" >
      <ion-button shape="round" fill="clear" (click)="startRecording()" *ngIf="!isRecordingStart" color="danger">
        <ion-icon name="videocam-outline"></ion-icon>
      </ion-button>
      <ion-button shape="round" fill="clear" (click)="stopRecording()" *ngIf="isRecordingStart" color="primary">
        <ion-icon name="videocam-off-outline"></ion-icon>
      </ion-button>
    </ion-col>
    <ion-col size="4" class="center">
      <ion-text color="danger" *ngIf="isRecordingStart">{{recordingCount}}</ion-text>
    </ion-col>
  </ion-row>
</ion-footer>
