<ion-content>
  <ion-row style="position:absolute;top:0px;background: transparent !important;z-index:100;width: 100%;">
    <ion-col size="4">
      <ion-button fill="clear" size="large" (click)="closeModal(null, false)" color="danger" *ngIf="!isRecordingStart"> X</ion-button>
    </ion-col>
    <ion-col size="4" class="center">
      <img src="assets/img/rec.gif" style="height:30px;width:30px;border-radius: 50%;" *ngIf="isRecordingStart">
    </ion-col>
    <ion-col size="4" class="ion-text-right">
      <ion-button fill="clear" color="danger" *ngIf="isRecordingStart">{{recordingCount | times}}</ion-button>
    </ion-col>
  </ion-row>

  <div class="midCenter center" *ngIf="COUNTDOWNTIME > 0">{{COUNTDOWNTIME}}</div>

  <div class="video-container" *ngIf="isCameraOpen">
    <video #videoElement class="videoElement" autoplay></video>
  </div>

  <ion-row style="position:absolute;bottom:0px;background: transparent !important;z-index:100;width: 100%;" *ngIf="COUNTDOWNTIME === 0">
    <ion-col size="4" class="center">
      <ion-button size="small" fill="outline" shape="round" color="danger" *ngIf="splitCount > 0">
        {{splitCount}}/{{videoCount}}
      </ion-button>
    </ion-col>
    <ion-col size="4" class="center" >
      <ion-button shape="round" class="ion-text-capitalize" (click)="startRecording()" *ngIf="!isRecordingStart && !isShowFinal && !isProcessing && PENDING_VIDEO.length === 0" color="primary">
        Start Recording <ion-icon name="videocam-outline" slot="end"></ion-icon>
      </ion-button>
      <ion-button shape="round" class="ion-text-capitalize" (click)="stopRecording()" *ngIf="isRecordingStart && !isShowFinal" color="danger">
        Finish <ion-icon name="videocam-off-outline" slot="end"></ion-icon>
      </ion-button>
      <ion-button shape="round" class="ion-text-capitalize" (click)="finalUpload()" *ngIf="isShowFinal" color="tertiary">
        Upload <ion-icon name="cloud-upload-outline" slot="end"></ion-icon>
      </ion-button>
    </ion-col>
    <ion-col size="4" class="center">
      <ion-spinner name="lines-sharp" color="danger" *ngIf="isProcessing"></ion-spinner>
    </ion-col>
  </ion-row>
</ion-content>
