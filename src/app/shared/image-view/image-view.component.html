<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Photo View</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close(null, false)">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <img id="myImage" style="height:100%;width:100%" alt="your img" [hidden]="base64">
  <img [src]="base64" style="height:100%;width:100%" alt="your img" [hidden]="!base64">
</ion-content>
